name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar tags e releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 7.3.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3.3'

      - name: Compilar
        run: gradle build --stacktrace

      - name: Separar o JAR final e ler versões
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          JAR=$(ls build/libs/*.jar | grep -v -- '-dev' | grep -v -- '-sources' | head -n 1)
          cp "$JAR" "SuperFornalha-v${VERSION}-mc${MC}.jar"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MC=$MC" >> $GITHUB_ENV

      - name: Definir nome da tag
        run: |
          TAG="v${VERSION}"
          # se a tag já existe (build repetido da mesma versão), usa sufixo
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Publicar Release com o JAR
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: Super Fornalha ${{ env.TAG }} (MC ${{ env.MC }})
          body: |
            Fornalha que funde itens 4x mais rápido.

            **Instalação:**
            1. Instale o Fabric Loader para 1.17.1 (fabricmc.net/use)
            2. Baixe o arquivo .jar abaixo
            3. Coloque na pasta `.minecraft/mods`
          files: SuperFornalha-*.jar
          fail_on_unmatched_files: true
